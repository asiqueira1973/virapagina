<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f5f5f6; }
    * { box-sizing: border-box; }
    a { color: #1c5fd8; text-decoration: none; }
    a:hover { color: #12439b; text-decoration: underline; }
  </style>
</helmet>
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #17181a; display: flex; min-height: 840px; background: #ffffff">

  <dc-import name="Sidebar" variante="autor" ativo="Meus livros" email="alexandre@dablab.com.br" hint-size="232px,100%"></dc-import>

  <main style="flex: 1; min-width: 0; background: #f5f5f6; padding: 34px 40px 60px">
    <div style="max-width: 1180px">

      <div style="margin-bottom: 26px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
        <div>
          <h1 style="margin: 0 0 5px; font-size: 25px; font-weight: 600; letter-spacing: -0.02em">Livros</h1>
          <p style="margin: 0; font-size: 13px; color: #8a8c91">{{ contagem }}</p>
        </div>
        <button style="border: none; cursor: {{ cursorDoBotao }}; border-radius: 10px; background: {{ fundoDoBotao }}; padding: 10px 16px; font-size: 13px; font-weight: 600; color: #ffffff; font-family: inherit; opacity: {{ opacidadeDoBotao }}">Novo livro</button>
      </div>

      <sc-if value="{{ noLimite }}" hint-placeholder-val="{{ false }}">
        <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid #f3d2d2; background: #fdf2f2; border-radius: 12px; padding: 14px 18px">
          <div style="display: flex; align-items: center; gap: 12px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a32020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 8v5"></path><path d="M12 16.5h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
            <p style="margin: 0; font-size: 13px; color: #a32020">Você chegou ao limite de 5 livros.</p>
          </div>
          <a href="#" style="flex-shrink: 0; border-radius: 10px; border: 1px solid #f3d2d2; background: #ffffff; padding: 7px 13px; font-size: 13px; font-weight: 600; color: #a32020; text-decoration: none">Falar com a gente</a>
        </div>
      </sc-if>

      <sc-if value="{{ vazia }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; border: 1px dashed #dcdcdf; background: #fcfcfd; border-radius: 16px; padding: 74px 24px">
          <div style="height: 58px; width: 44px; border-radius: 5px; border: 1px solid #dcdcdf; background: #ffffff"></div>
          <p style="margin: 0; font-size: 15px; font-weight: 500; color: #42444a">Nenhum livro ainda.</p>
          <button style="border: none; cursor: pointer; border-radius: 10px; background: #1c5fd8; padding: 10px 16px; font-size: 13px; font-weight: 600; color: #ffffff; font-family: inherit">Novo livro</button>
        </div>
      </sc-if>

      <sc-if value="{{ temLista }}" hint-placeholder-val="{{ true }}">
        <ul style="list-style: none; margin: 0; padding: 0; overflow: hidden; border-radius: 14px; border: 1px solid #e4e4e6; background: #ffffff">
          <sc-for list="{{ livros }}" as="livro" hint-placeholder-count="4">
            <li style="display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #f0f0f2; padding: 16px 18px">
              <div style="height: 52px; width: 38px; flex-shrink: 0; border-radius: 5px; border: 1px solid #e4e4e6; background: {{ livro.tomDaCapa }}"></div>
              <div style="min-width: 0; flex: 1">
                <a href="#" style="display: block; font-size: 14px; font-weight: 500; color: #17181a; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ livro.titulo }}</a>
                <p style="margin: 0; font-size: 12px; color: #8a8c91; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ livro.caminho }}</p>
              </div>
              <span style="display: inline-flex; flex-shrink: 0; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; background: {{ livro.fundoDoSelo }}; color: {{ livro.corDoSelo }}">{{ livro.selo }}</span>
              <div style="width: 130px; flex-shrink: 0; text-align: right; font-size: 12px; color: #8a8c91">{{ livro.atualizado }}</div>
              <div style="width: 128px; flex-shrink: 0; text-align: right">
                <sc-if value="{{ livro.publicado }}" hint-placeholder-val="{{ true }}">
                  <a href="#" style="font-size: 12px; font-weight: 500; color: #1c5fd8">Ver página pública</a>
                </sc-if>
              </div>
            </li>
          </sc-for>
        </ul>
      </sc-if>

    </div>
  </main>

</div>
</x-dc>
<script data-dc-script data-props='{"estado":{"editor":"enum","options":["normal","limite-atingido","vazia"],"default":"normal","section":"Estado"}}'>
class Component extends DCLogic {
  renderVals() {
    const estado = this.props.estado ?? 'normal';
    const vazia = estado === 'vazia';
    const noLimite = estado === 'limite-atingido';

    const acervo = [
      { titulo: 'Conceitos de Tecnologia para Pessoas Executivas', caminho: '/alexandre/conceitos-de-tecnologia · 44 páginas', publicado: true, atualizado: '2 set 2026', tomDaCapa: 'linear-gradient(160deg, #eef3fd, #dde6f8)' },
      { titulo: 'I See Life — 03', caminho: '/alexandre/i-see-life-3 · 28 páginas', publicado: true, atualizado: '18 ago 2026', tomDaCapa: 'linear-gradient(160deg, #f5f5f6, #e4e4e6)' },
      { titulo: 'I See Life — 02', caminho: '/alexandre/i-see-life-2 · 26 páginas', publicado: true, atualizado: '4 mai 2026', tomDaCapa: 'linear-gradient(160deg, #fdf2f2, #f3d2d2)' },
      { titulo: 'I See Life — 01', caminho: '/alexandre/i-see-life-1 · 24 páginas', publicado: true, atualizado: '12 fev 2026', tomDaCapa: 'linear-gradient(160deg, #eaf6ef, #d6ecdf)' },
      { titulo: 'Notas de produto — rascunho', caminho: '/alexandre/notas-de-produto · 12 páginas', publicado: false, atualizado: '7 set 2026', tomDaCapa: '#efeff1' },
    ];

    const livros = (noLimite ? acervo : acervo.slice(0, 4)).map((livro) => ({
      ...livro,
      selo: livro.publicado ? 'Publicado' : 'Rascunho',
      fundoDoSelo: livro.publicado ? '#eaf6ef' : '#efeff1',
      corDoSelo: livro.publicado ? '#1a7f4b' : '#75777c',
    }));

    return {
      vazia,
      noLimite,
      temLista: !vazia,
      livros,
      contagem: vazia ? 'Nenhum livro cadastrado' : `${livros.length} de 5 livros`,
      fundoDoBotao: noLimite ? '#8a8c91' : '#1c5fd8',
      cursorDoBotao: noLimite ? 'not-allowed' : 'pointer',
      opacidadeDoBotao: noLimite ? '0.6' : '1',
    };
  }
}
</script>
</body>
</html>
