<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f5f5f6; }
    * { box-sizing: border-box; }
    a { color: #1c5fd8; text-decoration: none; }
    a:hover { color: #12439b; text-decoration: underline; }
  </style>
</helmet>
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #17181a; background: #f5f5f6; min-height: 700px; display: flex; align-items: center; justify-content: center; padding: 64px 24px">
  <div style="width: 100%; max-width: 460px">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 32px">
      <span style="display: inline-block; width: 16px; height: 16px; border-radius: 4px; background: #1c5fd8"></span>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Virapágina</span>
    </div>

    <div style="border: 1px solid #e4e4e6; background: #ffffff; border-radius: 16px; padding: 28px">
      <h1 style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px">Escolha seu endereço</h1>
      <p style="font-size: 13px; color: #5c5e64; margin: 0 0 22px; line-height: 1.55">É por ele que as pessoas vão chegar nos seus livros. Escolha com calma: ele não pode ser trocado depois.</p>

      <label style="display: block">
        <span style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #42444a">Endereço</span>
        <div style="display: flex; align-items: center; overflow: hidden; border-radius: 10px; border: 1px solid {{ corDaBorda }}; background: #ffffff">
          <span style="flex-shrink: 0; border-right: 1px solid #e4e4e6; background: #f5f5f6; padding: 11px 12px; font-size: 13px; color: #8a8c91">virapagina.app.br/</span>
          <span style="flex: 1; min-width: 0; padding: 11px 12px; font-size: 14px">{{ valorDigitado }}</span>
          <sc-if value="{{ mostrarConfirmacao }}" hint-placeholder-val="{{ true }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1a7f4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px; flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          </sc-if>
        </div>
      </label>

      <sc-if value="{{ mostrarErro }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 10px 0 0; font-size: 13px; color: #a32020; line-height: 1.5">{{ mensagemDeErro }}
          <sc-if value="{{ mostrarSugestao }}" hint-placeholder-val="{{ false }}">
            <button style="border: none; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; color: #1c5fd8; text-decoration: underline">Usar {{ sugestao }}</button>
          </sc-if>
        </p>
      </sc-if>

      <sc-if value="{{ mostrarAjuda }}" hint-placeholder-val="{{ true }}">
        <p style="margin: 10px 0 0; font-size: 12px; color: #8a8c91; line-height: 1.5">De 3 a 30 letras minúsculas, números ou hífen.</p>
      </sc-if>

      <button style="margin-top: 22px; width: 100%; border: none; cursor: pointer; border-radius: 10px; background: #1c5fd8; padding: 12px 16px; font-size: 14px; font-weight: 600; color: #ffffff; font-family: inherit">Continuar</button>

      <div style="margin-top: 20px; border-top: 1px solid #e4e4e6; padding-top: 16px; display: flex; gap: 10px; align-items: flex-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8c91" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
        <p style="margin: 0; font-size: 12px; color: #8a8c91; line-height: 1.5">O endereço não pode ser alterado depois. Para trocar, fale com o suporte.</p>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"estado":{"editor":"enum","options":["disponivel","ocupado","invalido"],"default":"disponivel","section":"Estado"}}'>
class Component extends DCLogic {
  renderVals() {
    const estado = this.props.estado ?? 'disponivel';
    const porEstado = {
      disponivel: {
        valorDigitado: 'alexandre',
        corDaBorda: '#1c5fd8',
        mostrarConfirmacao: true,
        mostrarErro: false,
        mostrarAjuda: true,
        mensagemDeErro: '',
        mostrarSugestao: false,
        sugestao: '',
      },
      ocupado: {
        valorDigitado: 'alexandre',
        corDaBorda: '#f3d2d2',
        mostrarConfirmacao: false,
        mostrarErro: true,
        mostrarAjuda: false,
        mensagemDeErro: 'Esse endereço já está em uso, escolha outro.',
        mostrarSugestao: true,
        sugestao: 'alexandre-2',
      },
      invalido: {
        valorDigitado: 'Alexandre Siqueira',
        corDaBorda: '#f3d2d2',
        mostrarConfirmacao: false,
        mostrarErro: true,
        mostrarAjuda: false,
        mensagemDeErro: 'Use de 3 a 30 letras minúsculas, números ou hífen.',
        mostrarSugestao: false,
        sugestao: '',
      },
    };
    return porEstado[estado] ?? porEstado.disponivel;
  }
}
</script>
</body>
</html>
